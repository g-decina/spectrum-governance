[tool.poetry]
name = "spectrum-governance"
version = "0.1.0"
description = "AI/ML governance framework for regulatory compliance (EU AI Act, NIST AI RMF)"
authors = ["Guillaume Decina"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/YOUR_USERNAME/spectrum-governance"
repository = "https://github.com/YOUR_USERNAME/spectrum-governance"
documentation = "https://github.com/YOUR_USERNAME/spectrum-governance#readme"
keywords = ["ml-governance", "ai-audit", "regulatory-compliance", "eu-ai-act", "adversarial-testing", "explainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
packages = [
    { include = "spectrum" }
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# ---- CORE ----
pydantic = "^2.0.0"
loguru = "^0.7.0"
numpy = ">=1.26.0,<2.0.0"
typer = "^0.19"
jinja2 = "^3.1.0"
scikit-learn = ">=1.5.0, <1.6"
pandas = ">=2.0.0"
rich = "^13.0.0"
python-docx = "^1.1.0"

# ---- OPT: BLUE TEAM ----
mapie = {version = "^0.8.0", optional = true}
shap = {version = "^0.44.0", optional = true}
evidently = {version = "^0.4.0", optional = true}
openlineage-python = {version = "^1.0.0", optional = true}

# ---- OPT: RED TEAM ----
adversarial-robustness-toolbox = {version = "^1.17.0", optional = true}
garak = {version = "^0.9.0", optional = true}

# ONNX optimization for Rust backend
skl2onnx = {version = "^1.17.0", optional = true}
onnxruntime = {version = "^1.16.0", optional = true}

# ---- SERVING ----
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

# ---- OPT: BACKENDS ----
torch = {version = ">=2.0.0", optional = true}
tensorflow = {version = ">=2.14.0", optional = true}

[tool.poetry.extras]
# Allows: pip install spectrum-governance[blue]
blue = ["mapie", "shap", "evidently", "openlineage-python"]
red = ["adversarial-robustness-toolbox", "garak", "skl2onnx", "onnxruntime"]
red_torch = ["adversarial-robustness-toolbox", "garak", "torch", "skl2onnx", "onnxruntime"]
red_tensorflow = ["adversarial-robustness-toolbox", "garak", "tensorflow", "skl2onnx", "onnxruntime"]
server = ["fastapi", "uvicorn"]

[tool.poetry.scripts]
spectrum = "spectrum.cli.main:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-mock = "^3.12.0"
ruff = "^0.3.0"
maturin = "^1.10.2"
# ONNX deps required for benchmark tests - prevents recurring "ONNX not available" issues
skl2onnx = "^1.17.0"
onnxruntime = "^1.16.0"
psutil = "^5.9.0"
